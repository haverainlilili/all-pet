name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 打包 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.2.4'
          update-sdk-modules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 安装 Linux 静态链接依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev

      - name: 构建自包含 Swift 核心
        run: swift build -c release --static-swift-stdlib

      - name: 准备 sidecar（Node 原生路径）
        run: node desktop/scripts/prepare-sidecar.js
        env:
          ALLPET_SIDECAR_DIR: ${{ github.workspace }}/desktop/sidecar

      - name: 验证空 HOME / 无 Swift PATH / 精确宠物操作
        run: node desktop/scripts/verify-sidecar.js
        env:
          ALLPET_SIDECAR_DIR: ${{ github.workspace }}/desktop/sidecar
          ALLPET_TEST_HOME: ${{ runner.temp }}/allpet-release-fresh-home
          ALLPET_CLEAN_PATH: '1'

      - name: 安装依赖
        run: npm ci
        working-directory: desktop

      - name: 打包（tag 发布 Release，手动只出产物）
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npx electron-builder --publish always
          else
            npx electron-builder --publish never
          fi
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传产物（兜底）
        uses: actions/upload-artifact@v5
        with:
          name: allpet-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.yml
          if-no-files-found: ignore
