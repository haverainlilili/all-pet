name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 打包 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.2.4'
          update-sdk-modules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 校验 tag 与安装包版本一致
        run: node -e "const v=require('./desktop/package.json').version,r=process.env.GITHUB_REF;if(r.startsWith('refs/tags/')&&r!=='refs/tags/v'+v)throw new Error('Tag/package version mismatch')"

      - name: 安装 Linux 静态链接依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev

      - name: 构建自包含 Swift 核心
        run: swift build -c release --static-swift-stdlib

      - name: 准备 sidecar（Node 原生路径）
        run: node desktop/scripts/prepare-sidecar.js
        env:
          ALLPET_SIDECAR_DIR: ${{ github.workspace }}/desktop/sidecar

      - name: 验证空 HOME / 无 Swift PATH / 精确宠物操作
        run: node desktop/scripts/verify-sidecar.js
        env:
          ALLPET_SIDECAR_DIR: ${{ github.workspace }}/desktop/sidecar
          ALLPET_TEST_HOME: ${{ runner.temp }}/allpet-release-fresh-home
          ALLPET_CLEAN_PATH: '1'

      - name: 安装依赖
        run: npm ci
        working-directory: desktop

      - name: Electron 行为回归
        run: npm test
        working-directory: desktop

      - name: 九平台原生格式及 SQLite WAL 验收
        run: node desktop/scripts/verify-platform-integrations.js

      - name: macOS 核心与查看桥接回归
        if: runner.os == 'macOS'
        run: |
          .build/release/allpet self-test
          .build/release/allpet selection-self-test
          ALLPET_BINARY="$PWD/.build/release/allpet" node desktop/scripts/verify-manual-view-bridge.js

      - name: 打包（tag 上传 Release 草稿，手动只出产物）
        shell: bash
        run: |
          args=(--publish never)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args=(--publish always)
          fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=(--arm64 --config.mac.identity=- --config.mac.hardenedRuntime=false)
          else
            args+=(--x64)
          fi
          npx electron-builder "${args[@]}"
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: macOS 成品签名、资源和回执检查
        if: runner.os == 'macOS'
        shell: bash
        working-directory: desktop
        run: |
          apps=(dist/mac*/AllPet.app)
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict "${apps[0]}"
          test -d "${apps[0]}/Contents/Resources/sidecar/AllPet_AllPetCore.bundle"
          ALLPET_APP_BINARY="$PWD/${apps[0]}/Contents/MacOS/AllPet" node scripts/verify-manual-view.js

      - name: Windows 成品菜单连续点击与失焦关闭
        if: runner.os == 'Windows'
        run: node desktop/scripts/verify-tray-panel.js
        env:
          ALLPET_APP_BINARY: ${{ github.workspace }}/desktop/dist/win-unpacked/AllPet.exe
          ALLPET_TRAY_PANEL_OUTPUT: ${{ runner.temp }}/tray-panel/menu.json

      - name: 保存 Windows 成品菜单验收
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: packaged-menu-windows
          path: ${{ runner.temp }}/tray-panel/
          if-no-files-found: ignore

      - name: 上传产物（兜底）
        uses: actions/upload-artifact@v5
        with:
          name: allpet-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.yml
          if-no-files-found: ignore
