name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 打包 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.2.4'
          update-sdk-modules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 构建 Swift 核心
        run: swift build -c release

      - name: 准备 sidecar 二进制
        shell: bash
        run: |
          mkdir -p desktop/sidecar
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp .build/release/allpet.exe desktop/sidecar/allpet.exe
          else
            cp .build/release/allpet desktop/sidecar/allpet
          fi

      - name: 安装依赖
        run: npm ci
        working-directory: desktop

      - name: 打包（tag 发布 Release，手动只出产物）
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npx electron-builder --publish always
          else
            npx electron-builder --publish never
          fi
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传产物（兜底）
        uses: actions/upload-artifact@v4
        with:
          name: allpet-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.yml
          if-no-files-found: ignore
