name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 打包 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.2.4'
          update-sdk-modules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 构建自包含 Swift 核心
        run: swift build -c release --static-swift-stdlib

      - name: 准备并验证 sidecar
        shell: bash
        run: |
          set -euo pipefail
          BIN_PATH="$(swift build -c release --static-swift-stdlib --show-bin-path)"
          rm -rf desktop/sidecar
          mkdir -p desktop/sidecar
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$BIN_PATH/allpet.exe" desktop/sidecar/allpet.exe
            SIDECAR=desktop/sidecar/allpet.exe
          else
            cp "$BIN_PATH/allpet" desktop/sidecar/allpet
            SIDECAR=desktop/sidecar/allpet
          fi
          if [ -d "$BIN_PATH/AllPet_AllPetCore.bundle" ]; then
            RESOURCE="$BIN_PATH/AllPet_AllPetCore.bundle"
          elif [ -d "$BIN_PATH/AllPet_AllPetCore.resources" ]; then
            RESOURCE="$BIN_PATH/AllPet_AllPetCore.resources"
          else
            echo "missing AllPetCore resources in $BIN_PATH" >&2
            exit 1
          fi
          cp -R "$RESOURCE" "desktop/sidecar/$(basename "$RESOURCE")"
          TEST_HOME="$RUNNER_TEMP/allpet-release-fresh-home"
          rm -rf "$TEST_HOME"
          mkdir -p "$TEST_HOME"
          if [ "$RUNNER_OS" = "Windows" ]; then
            CLEAN_PATH="/c/Windows/System32:/c/Windows"
          else
            CLEAN_PATH="/usr/bin:/bin"
          fi
          NODE="$(command -v node)"
          CFFIXED_USER_HOME="$TEST_HOME" HOME="$TEST_HOME" USERPROFILE="$TEST_HOME" PATH="$CLEAN_PATH" \
            "$NODE" desktop/scripts/verify-sidecar.js "$SIDECAR" "$TEST_HOME"

      - name: 安装依赖
        run: npm ci
        working-directory: desktop

      - name: 打包（tag 发布 Release，手动只出产物）
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npx electron-builder --publish always
          else
            npx electron-builder --publish never
          fi
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传产物（兜底）
        uses: actions/upload-artifact@v5
        with:
          name: allpet-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.yml
          if-no-files-found: ignore
