name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: Swift 核心 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.2.4'
          update-sdk-modules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: 安装 Linux 静态链接依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev
      - name: 构建
        run: swift build
      - name: 宠物管理与窗口契约测试
        run: swift run allpet selection-self-test
      - name: AppKit 首启 / 失效路径 / 隐藏恢复
        if: runner.os == 'macOS'
        run: node desktop/scripts/verify-appkit-lifecycle.js
      - name: Core 自检（当前仅 macOS）
        if: runner.os == 'macOS'
        run: swift run allpet self-test
      - name: status --json 冒烟测试
        shell: bash
        run: |
          swift run allpet status --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.animation||!Array.isArray(j.platforms)){console.error('bad json');process.exit(1)}console.log('OK:',j.animation,j.platforms.length+' platforms')})"
      - name: 构建自包含 release sidecar
        run: swift build -c release --static-swift-stdlib
      - name: 准备 release sidecar（原生路径）
        run: node desktop/scripts/prepare-sidecar.js
        env:
          ALLPET_SIDECAR_DIR: ${{ runner.temp }}/allpet-sidecar
      - name: 空 HOME / 无 Swift PATH / 精确宠物操作
        run: node desktop/scripts/verify-sidecar.js
        env:
          ALLPET_SIDECAR_DIR: ${{ runner.temp }}/allpet-sidecar
          ALLPET_TEST_HOME: ${{ runner.temp }}/allpet-fresh-home
          ALLPET_CLEAN_PATH: '1'

  desktop:
    name: Electron 壳 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: 安装依赖
        run: npm ci
        working-directory: desktop
      - name: JS 语法检查
        shell: bash
        run: |
          node -c main.js && node -c preload.js && node -c src/renderer.js && node -c src/motion.js && node -c src/pets.js && node -c src/pet-thumbnail.js && node -c src/dsh-wake.js && node -c src/wake.js && node -c src/pet-state.js && node -c src/task-history.js && node -c src/tray-menu.js && node -c src/interaction.js && node -c src/atlas.js && node -c src/latest.js && node -c scripts/prepare-sidecar.js && node -c scripts/verify-sidecar.js && node -c scripts/verify-appkit-lifecycle.js && node -c scripts/zstdcat.js && echo "syntax OK"
        working-directory: desktop
      - name: Electron 行为测试
        run: npm test
        working-directory: desktop

  desktop-smoke:
    name: Electron 冒烟（Linux + xvfb）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.2.4'
          update-sdk-modules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: 安装 Linux 静态链接依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev
      - name: 构建自包含 Swift 核心
        run: swift build -c release --static-swift-stdlib
      - name: 准备并验证打包 sidecar 资源
        run: |
          node desktop/scripts/prepare-sidecar.js
          ALLPET_CLEAN_PATH=1 ALLPET_SIDECAR_DIR="$PWD/desktop/sidecar" ALLPET_TEST_HOME=/tmp/allpet-fresh-home \
            node desktop/scripts/verify-sidecar.js
      - name: 安装 Electron
        run: npm ci
        working-directory: desktop
      - name: 安装无头依赖
        run: |
          sudo apt-get install -y xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
      - name: 构建解包 Electron 应用
        run: npm run dist:dir
        working-directory: desktop
      - name: 无头启动 + 三阶段任务气泡截图
        working-directory: desktop
        run: |
          for stage in collapsed platforms tasks; do
            xvfb-run -a --server-args="-screen 0 1024x768x24" \
              env ELECTRON_DISABLE_SANDBOX=1 ALLPET_NO_SANDBOX=1 \
                  ALLPET_SCREENSHOT="/tmp/bubble-${stage}.png" ALLPET_SCREENSHOT_STAGE="$stage" \
                  ELECTRON_ENABLE_LOGGING=1 \
              ./node_modules/.bin/electron . --no-sandbox
          done
          for anchor in top-left top-right bottom-left bottom-right; do
            xvfb-run -a --server-args="-screen 0 1024x768x24" \
              env ELECTRON_DISABLE_SANDBOX=1 ALLPET_NO_SANDBOX=1 \
                  ALLPET_SCREENSHOT="/tmp/anchor-${anchor}.png" ALLPET_SCREENSHOT_STAGE=tasks ALLPET_SCREENSHOT_ANCHOR="$anchor" \
                  ELECTRON_ENABLE_LOGGING=1 \
              ./node_modules/.bin/electron . --no-sandbox
          done
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            env ELECTRON_DISABLE_SANDBOX=1 ALLPET_NO_SANDBOX=1 ALLPET_REDUCE_MOTION_SMOKE=1 \
                ALLPET_SCREENSHOT=/tmp/bubble-reduced-motion.png ALLPET_SCREENSHOT_STAGE=collapsed ELECTRON_ENABLE_LOGGING=1 \
            ./node_modules/.bin/electron . --no-sandbox
          rm -rf /tmp/allpet-electron-no-pet-home
          mkdir -p /tmp/allpet-electron-no-pet-home/.config/all-pet
          touch /tmp/allpet-electron-no-pet-home/.config/all-pet/.bundled-pets.v1
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            env CFFIXED_USER_HOME=/tmp/allpet-electron-no-pet-home HOME=/tmp/allpet-electron-no-pet-home ALLPET_HOME=/tmp/allpet-electron-no-pet-home \
                ELECTRON_DISABLE_SANDBOX=1 ALLPET_NO_SANDBOX=1 ALLPET_EXPECT_NO_PET_START=1 \
                ALLPET_SCREENSHOT=/tmp/bubble-no-pet.png ALLPET_SCREENSHOT_STAGE=collapsed ELECTRON_ENABLE_LOGGING=1 \
            ./node_modules/.bin/electron . --no-sandbox
      - name: 无头启动宠物管理窗口 + 截图
        working-directory: desktop
        run: |
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            env ELECTRON_DISABLE_SANDBOX=1 ALLPET_NO_SANDBOX=1 ALLPET_PET_MANAGER_SCREENSHOT=/tmp/pets.png ELECTRON_ENABLE_LOGGING=1 \
            ./node_modules/.bin/electron . --no-sandbox
      - name: 校验截图
        run: |
          test -s /tmp/bubble-collapsed.png
          test -s /tmp/bubble-platforms.png
          test -s /tmp/bubble-tasks.png
          test -s /tmp/bubble-reduced-motion.png
          test -s /tmp/bubble-no-pet.png
          test -s /tmp/anchor-top-left.png
          test -s /tmp/anchor-top-right.png
          test -s /tmp/anchor-bottom-left.png
          test -s /tmp/anchor-bottom-right.png
          echo "三阶段任务气泡与四锚点截图已生成，DOM/工作区几何校验已通过"
      - name: 托盘生命周期与缩放位置冒烟
        working-directory: desktop
        run: |
          rm -rf /tmp/allpet-electron-home
          mkdir -p /tmp/allpet-electron-home
          PACKAGED=dist/linux-unpacked/allpet-desktop
          [ -x "$PACKAGED" ] || PACKAGED=dist/linux-unpacked/AllPet
          [ -x "$PACKAGED" ] || PACKAGED=dist/linux-unpacked/allpet
          test -x "$PACKAGED"
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            env CFFIXED_USER_HOME=/tmp/allpet-electron-home HOME=/tmp/allpet-electron-home PATH=/usr/bin:/bin \
                ELECTRON_DISABLE_SANDBOX=1 ALLPET_NO_SANDBOX=1 ALLPET_SCREENSHOT_STAGE=collapsed \
                ALLPET_LIFECYCLE_SMOKE=/tmp/lifecycle.json ELECTRON_ENABLE_LOGGING=1 \
            "$PACKAGED" --no-sandbox
          node -e "const j=require('/tmp/lifecycle.json');if(!j.initiallyVisible||!j.hidden||!j.shown||!j.petID||!j.preserved)process.exit(1);const fs=require('fs'),p=require('path').join('/tmp/allpet-electron-home','.config','all-pet','config.json'),c=require(p);c.pet.enabled=false;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');console.log(j)"
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            env CFFIXED_USER_HOME=/tmp/allpet-electron-home HOME=/tmp/allpet-electron-home PATH=/usr/bin:/bin \
                ELECTRON_DISABLE_SANDBOX=1 ALLPET_NO_SANDBOX=1 ALLPET_SCREENSHOT_STAGE=collapsed ALLPET_EXPECT_HIDDEN_START=1 \
                ALLPET_LIFECYCLE_SMOKE=/tmp/lifecycle-disabled.json ELECTRON_ENABLE_LOGGING=1 \
            "$PACKAGED" --no-sandbox
          node -e "const j=require('/tmp/lifecycle-disabled.json');if(j.initiallyVisible||!j.hidden||!j.shown||!j.petID||!j.preserved)process.exit(1);console.log(j)"
          rm -rf /tmp/allpet-electron-override
          mkdir -p /tmp/allpet-electron-override/.config/all-pet
          node -e "const fs=require('fs'),p='/tmp/allpet-electron-override/.config/all-pet/task-history.json',u='123e4567-e89b-12d3-a456-426614174000',n=(Date.now()-Date.UTC(2001,0,1))/1000;fs.writeFileSync(p,JSON.stringify({platforms:{dsh:[{id:'stale',platform:'wrong',sessionID:u,phase:'done',title:'fixture',updatedAt:n,sourcePath:'/tmp/session-'+u+'/session.jsonl.zstd',unsafe:'drop'}]},dismissedTaskIDs:[42,'dsh|223e4567-e89b-12d3-a456-426614174000']}))"
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            env CFFIXED_USER_HOME=/tmp/allpet-electron-home HOME=/tmp/allpet-electron-home ALLPET_HOME=/tmp/allpet-electron-override PATH=/usr/bin:/bin \
                ELECTRON_DISABLE_SANDBOX=1 ALLPET_NO_SANDBOX=1 ALLPET_SCREENSHOT_STAGE=collapsed \
                ALLPET_LIFECYCLE_SMOKE=/tmp/lifecycle-override.json ELECTRON_ENABLE_LOGGING=1 \
            "$PACKAGED" --no-sandbox
          node -e "const fs=require('fs'),path=require('path'),h='/tmp/allpet-electron-override',j=require('/tmp/lifecycle-override.json'),c=require(path.join(h,'.config/all-pet/config.json')),x=require(path.join(h,'.config/all-pet/task-history.json')),t=x.platforms.dsh&&x.platforms.dsh[0];if(!j.initiallyVisible||!j.preserved||!String(c.pet.bundlePath||'').startsWith(h+path.sep)||!t||t.id!=='dsh|session-123e4567-e89b-12d3-a456-426614174000'||('unsafe' in t)||x.dismissedTaskIDs[0]!=='dsh|session-223e4567-e89b-12d3-a456-426614174000')process.exit(1);console.log({bundlePath:c.pet.bundlePath,task:t.id})"
          test "$(stat -c '%a' /tmp/allpet-electron-override/.config/all-pet/task-history.json)" = 600
          rm -rf /tmp/allpet-electron-zstd-home
          mkdir -p /tmp/allpet-electron-zstd-home/.dsh/sessions/session-bridge
          printf '%s\n' \
            '{"type":"session","id":"bridge","cwd":"/tmp/bridge"}' \
            '{"type":"session/title","data":{"title":"Decoder Bridge"}}' \
            '{"type":"user/message","data":{"source":{"kind":"user"},"content":[{"type":"text","text":"内置 decoder 验收"}]}}' \
            '{"type":"todo/write","data":{"todos":[{"content":"验证 decoder","status":"in_progress"}]}}' > /tmp/allpet-electron-zstd-home/fixture.jsonl
          ELECTRON_RUN_AS_NODE=1 "$PACKAGED" -e "const fs=require('fs'),z=require('node:zlib');fs.writeFileSync(process.argv[1],z.zstdCompressSync(fs.readFileSync(process.argv[2])))" /tmp/allpet-electron-zstd-home/.dsh/sessions/session-bridge/session.jsonl.zstd /tmp/allpet-electron-zstd-home/fixture.jsonl
          PACKAGED_ABS="$(readlink -f "$PACKAGED")"
          DECODER="$(pwd)/dist/linux-unpacked/resources/zstd/zstdcat.js"
          SIDECAR="$(pwd)/dist/linux-unpacked/resources/sidecar/allpet"
          test -f "$DECODER"
          test -x "$SIDECAR"
          ELECTRON_RUN_AS_NODE=1 "$PACKAGED_ABS" "$DECODER" /tmp/allpet-electron-zstd-home/.dsh/sessions/session-bridge/session.jsonl.zstd > /tmp/allpet-electron-zstd-home/decoded.jsonl
          cmp /tmp/allpet-electron-zstd-home/fixture.jsonl /tmp/allpet-electron-zstd-home/decoded.jsonl
          PREFIX_JSON="$(node -e 'console.log(JSON.stringify([process.argv[1]]))' "$DECODER")"
          env ALLPET_HOME=/tmp/allpet-electron-zstd-home PATH=/usr/bin:/bin ELECTRON_RUN_AS_NODE=1 ALLPET_ZSTD_ELECTRON_NODE=1 ALLPET_ZSTD_EXECUTABLE="$PACKAGED_ABS" ALLPET_ZSTD_PREFIX_JSON="$PREFIX_JSON" \
            "$SIDECAR" status --json > /tmp/allpet-electron-zstd-home/status.json
          node -e "const j=require('/tmp/allpet-electron-zstd-home/status.json'),d=j.platforms.find(x=>x.platform==='dsh');console.log(d);if(!d||!d.task||d.task.title!=='内置 decoder 验收')process.exit(1)"
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            env CFFIXED_USER_HOME=/tmp/allpet-electron-zstd-home HOME=/tmp/allpet-electron-zstd-home ALLPET_HOME=/tmp/allpet-electron-zstd-home PATH=/usr/bin:/bin \
                ELECTRON_DISABLE_SANDBOX=1 ALLPET_NO_SANDBOX=1 ALLPET_EXPECT_DSH_TASK_TITLE='内置 decoder 验收' \
                ALLPET_LIFECYCLE_SMOKE=/tmp/lifecycle-zstd.json ELECTRON_ENABLE_LOGGING=1 \
            "$PACKAGED" --no-sandbox
          node -e "const j=require('/tmp/lifecycle-zstd.json');if(j.dshTaskTitle!=='内置 decoder 验收')process.exit(1);console.log({dshTaskTitle:j.dshTaskTitle})"
      - name: 校验宠物管理截图
        run: test -s /tmp/pets.png && echo "宠物管理窗口截图已生成"
      - name: 上传气泡截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-bubble-screenshots
          path: |
            /tmp/bubble-collapsed.png
            /tmp/bubble-platforms.png
            /tmp/bubble-tasks.png
            /tmp/bubble-reduced-motion.png
            /tmp/bubble-no-pet.png
            /tmp/anchor-top-left.png
            /tmp/anchor-top-right.png
            /tmp/anchor-bottom-left.png
            /tmp/anchor-bottom-right.png
            /tmp/pets.png
          if-no-files-found: ignore
